<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256" shape-rendering="crispEdges">
  <rect width="128" height="128" fill="#1D2B53"/>
  <!-- Mountain silhouette -->
  <polygon points="16,96 48,48 80,96" fill="#7E2553"/>
  <polygon points="40,56 48,48 56,56 48,60" fill="#FFF1E8"/>
  <polygon points="56,96 88,36 120,96" fill="#008751"/>
  <polygon points="80,46 88,36 96,46 88,52" fill="#FFF1E8"/>
  <!-- Ground -->
  <rect y="96" width="128" height="32" fill="#AB5236"/>
  <rect y="96" width="128" height="4" fill="#5F574F"/>
  <!-- 8-bit Sun -->
  <rect x="52" y="16" width="24" height="24" fill="#FFA300"/>
  <rect x="56" y="12" width="16" height="32" fill="#FFEC27"/>
  <rect x="48" y="20" width="32" height="16" fill="#FFEC27"/>
  <!-- Pixel Cloud -->
  <rect x="12" y="28" width="28" height="8" fill="#C2C3C7"/>
  <rect x="18" y="24" width="16" height="16" fill="#FFF1E8"/>
  <!-- 8-Bit Hero -->
  <rect x="32" y="86" width="6" height="10" fill="#29ADFF"/>
  <rect x="34" y="82" width="4" height="4" fill="#FFCCAA"/>
  <rect x="38" y="84" width="2" height="8" fill="#FF77A8"/>
  <!-- Decorative border -->
  <rect x="0" y="0" width="128" height="128" fill="none" stroke="#2C2824" stroke-width="4"/>
</svg>